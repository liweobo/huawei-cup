schema_version: 1
mechanism_closure:
  model_name: 2005D regenerative lost-sales inventory
  prediction_or_simulation_target: conditional expected cost/day and service metrics
  closure_scope: Empirical lead laws for Q2; given uniform law for Q4; explicit demand
    scenario Q5
  geometry_requirements:
  - name: capacity
    meaning: Own storage and rented overflow
    required_for: Q1-Q5 declared-model simulation
    source_type: GIVEN
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: Q0<Q; Q4 Q0=6,Q=10
    unit: items or m3
    status: RESOLVED
    essential: true
    assumption_reason: ''
  state_initial_requirements:
  - name: initial_state
    meaning: post-arrival target; no backlog/order
    required_for: Q1-Q5 declared-model simulation
    source_type: ASSUMED
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: I=b
    unit: items or m3
    status: ASSUMED
    essential: true
    assumption_reason: See assumptions.md and sensitivity results
  boundary_interface_requirements:
  - name: top_up
    meaning: one order; receipt-time top-up; own-first
    required_for: Q1-Q5 declared-model simulation
    source_type: ASSUMED
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: nonnegative receipt=b-I; overflow rented
    unit: items or m3
    status: ASSUMED
    essential: true
    assumption_reason: See assumptions.md and sensitivity results
  forcing_input_requirements:
  - name: lead_law
    meaning: conditional iid lead inputs
    required_for: Q1-Q5 declared-model simulation
    source_type: ASSUMED
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: empirical or continuous U(1,3)
    unit: days
    status: ASSUMED
    essential: true
    assumption_reason: See assumptions.md and sensitivity results
  - name: demand
    meaning: Q1-Q4 fixed rates; Q5 scenario
    required_for: Q1-Q5 declared-model simulation
    source_type: ASSUMED
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: inputs.json; Q5 two-point law
    unit: stock/day
    status: ASSUMED
    essential: true
    assumption_reason: See assumptions.md and sensitivity results
  material_constitutive_requirements:
  - name: shortage_cost
    meaning: unit conflict resolved by explicit scenarios
    required_for: Q1-Q5 declared-model simulation
    source_type: ASSUMED
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: primary yuan/lost unit; alternate exposure
    unit: yuan
    status: ASSUMED
    essential: true
    assumption_reason: See assumptions.md and sensitivity results
  observation_requirements:
  - name: objective
    meaning: renewal reward / finite scenario
    required_for: Q1-Q5 declared-model simulation
    source_type: ASSUMED
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: E[C]/E[T] or E[C_H]/H
    unit: yuan/day
    status: ASSUMED
    essential: true
    assumption_reason: See assumptions.md and sensitivity results
  termination_horizon_requirements:
  - name: horizon
    meaning: exact cycle integration plus N refinement; Q5 H=120
    required_for: Q1-Q5 declared-model simulation
    source_type: ASSUMED
    source: problem-facts.md; assumptions.md; model.md
    value_or_parameter: 512/1024 cycles; finite 120 days
    unit: days/cycles
    status: ASSUMED
    essential: true
    assumption_reason: See assumptions.md and sensitivity results
  unresolved_requirements: []
  parameterized_requirements: []
  identifiability_status: LIMITED
  numerical_termination_verified: true
  assumptions_added:
  - name: initial_state
    reason: Operational/model choice explicitly needed for closure
    plausible_range: Alternatives and checks in assumptions.md and results/sensitivity.json
    result_dependency: All numerical claims remain conditional
  - name: top_up
    reason: Operational/model choice explicitly needed for closure
    plausible_range: Alternatives and checks in assumptions.md and results/sensitivity.json
    result_dependency: All numerical claims remain conditional
  - name: lead_law
    reason: Operational/model choice explicitly needed for closure
    plausible_range: Alternatives and checks in assumptions.md and results/sensitivity.json
    result_dependency: All numerical claims remain conditional
  - name: demand
    reason: Operational/model choice explicitly needed for closure
    plausible_range: Alternatives and checks in assumptions.md and results/sensitivity.json
    result_dependency: All numerical claims remain conditional
  - name: shortage_cost
    reason: Operational/model choice explicitly needed for closure
    plausible_range: Alternatives and checks in assumptions.md and results/sensitivity.json
    result_dependency: All numerical claims remain conditional
  - name: objective
    reason: Operational/model choice explicitly needed for closure
    plausible_range: Alternatives and checks in assumptions.md and results/sensitivity.json
    result_dependency: All numerical claims remain conditional
  - name: horizon
    reason: Operational/model choice explicitly needed for closure
    plausible_range: Alternatives and checks in assumptions.md and results/sensitivity.json
    result_dependency: All numerical claims remain conditional
  model_form_uncertainty:
    status: PRESENT
    acknowledged: true
    rationale: Printed c4 unit conflict, finite empirical samples, continuous uniform
      interpretation
    evidence:
    - assumptions.md
    - results/sensitivity.json
  evidence:
  - model.md
  - validation/model-checks.json
  closure_status: SCENARIO_ASSUMED
  allowed_claim_level: SCENARIO_RESULT
