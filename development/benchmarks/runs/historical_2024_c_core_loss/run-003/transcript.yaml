      "assistant": "建议先采用“温度修正 \\(k\\) 参数”的最小扩展，不让温度同时改变频率指数和磁通密度指数。\n\n原始 Steinmetz 方程：\n\n\\[\nP=k f^{\\alpha}B_m^{\\beta}\n\\]\n\n温度修正方程：\n\n\\[\nP=k_0\\exp[\\gamma(T-T_0)]f^{\\alpha}B_m^{\\beta},\n\\qquad T_0=25^\\circ\\mathrm C\n\\]\n\n取对数后变为：\n\n\\[\n\\ln P\n=\na+\\alpha\\ln f+\\beta\\ln B_m+\\gamma(T-25),\n\\qquad a=\\ln k_0\n\\]\n\n其中：\n\n- \\(P\\)：磁芯损耗密度，单位为 \\(\\mathrm{W/m^3}\\)；\n- \\(f\\)：频率；\n- \\(B_m\\)：一个周期内的磁通密度峰值幅值；\n- \\(T\\)：温度；\n- \\(\\gamma\\)：温度修正系数。\n\n如果 \\(\\gamma>0\\)，说明在其他条件相近时，温度升高会使损耗增大；如果 \\(\\gamma<0\\)，则相反。这个符号由数据估计，不提前假定。\n\n**拟采用的假设**\n\n1. 只使用材料 1、正弦波数据，材料和波形固定，不再加入材料或波形变量。\n2. 温度首先只作用于 Steinmetz 方程的系数 \\(k\\)，即改变损耗整体水平，不改变 \\(\\alpha,\\beta\\)。\n3. 温度效应在 \\(\\ln P\\) 空间中近似线性，因此 \\(k(T)\\) 采用指数形式。\n4. 频率和磁通密度峰值是预测时可获得的输入。\n5. 不根据 IQR 结果自动删除高损耗点；所有有效观测先保留。\n6. \\(B_m\\) 的主定义需要在正式运行前固定。建议先用一周期峰值幅值\n   \\[\n   B_m=\\max_j|B_j|\n   \\]\n   并把\n   \\[\n   B_{pp}/2=(\\max B_j-\\min B_j)/2\n   \\]\n   作为敏感性版本。题面公式图片中的具体峰值定义还需最终核对。\n\n**比较协议**\n\n已完成的附件审计显示，材料 1 的正弦波样本为 1067 条，且没有缺失值。正式比较只使用这些数据，不使用附件二、附件三或附件四。\n\n主验证采用“按温度留一法”：\n\n- 温度水平为 25、50、70、90 °C；\n- 每次完整留出一个温度；\n- 用其他三个温度拟合原始 SE 和温度修正 SE；\n- 两个模型在完全相同的测试行上比较；\n- 共 4 个验证折，不使用随机 8:2 切分作为唯一结论。\n\n评价指标预先固定为：\n\n- 主指标：\\(\\ln P\\) 空间 RMSE；\n- 辅助指标：\\(\\ln P\\) 空间 MAE；\n- 原始单位下的 MAE，单位为 \\(\\mathrm{W/m^3}\\)；\n- 中位绝对百分比误差 MdAPE；\n- 四个温度折的均值、标准差和逐折差值。\n\n判断规则是：只有当温度修正方程在主指标上整体优于原始 SE，并且优势不是由单个温度折贡献时，才认为温度因素带来了可观察改善；否则结论写成“在当前协议下未证明修正有效”。\n\n当前只确定了假设和协议，尚未拟合 \\(k,\\alpha,\\beta,\\gamma\\)，也尚未计算任何误差。后续运行产生的系数和指标才会标记为真实结果；现在均为 `NOT RUN`。",
