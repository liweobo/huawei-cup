    推荐方程\n传统 Steinmetz 方程写成无量纲形式：\n\\[\nP_{\\mathrm{SE}}\n=k\\left(\\frac{f}{f_0}\\\
    right)^\\alpha\n\\left(\\frac{B_m}{B_0}\\right)^\\beta\n\\]建议取 \\(f_0=100\\,\\\
    mathrm{kHz}\\)、\\(B_0=0.1\\,\\mathrm T\\)。\n定义标准化温度：\n\\[\n\\theta=\\frac{T-25}{65}\n\
    \\]使25℃对应 \\(\\theta=0\\)，90℃对应 \\(\\theta=1\\)。温度修正模型为：\n\\[\nP_{\\mathrm{TSE}}\n\
    =k\\left(\\frac{f}{f_0}\\right)^\\alpha\n\\left(\\frac{B_m}{B_0}\\right)^\\beta\n\
    \\exp(c_1\\theta+c_2\\theta^2)\n\\]取对数后：\n\\[\n\\ln P\n=\\ln k+\\alpha\\ln\\frac{f}{f_0}\n\
    +\\beta\\ln\\frac{B_m}{B_0}\n+c_1\\theta+c_2\\theta^2+\\varepsilon\n\\]其中：\n-\
    \ \\(c_1\\)描述温度的一阶影响；\n- \\(c_2\\)允许损耗随温度呈非单调变化；\n- 25℃时温度修正因子等于1，因此 \\(k\\)可解释为25℃参考工况下的系数。\n\
