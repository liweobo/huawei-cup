    theta\\ln f+c_3\\theta\\ln B_m\n\\]但要强调：\n- TI对随机验证更好；\n- 在边界外推时不总是优于T2；\n- 它更适合作为“扩展模型/敏感性模型”，不一定是问题二的主模型。\n\
