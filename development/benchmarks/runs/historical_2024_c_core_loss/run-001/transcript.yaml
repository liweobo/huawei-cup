    \ artifact_kind=\"workbook\" sheet=\"Sheet1\" range=\"A1:C401\"}\n\n\n训练集分布：\n\
    - 材料1—4分别有 3400、3000、3200、2800 条。\n- 正弦波 4054 条、三角波 4948 条、梯形波 3398 条，略不平衡但不严重。\n\
