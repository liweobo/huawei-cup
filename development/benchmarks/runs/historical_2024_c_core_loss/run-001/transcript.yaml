    温度±1℃\t0.1844\t0.1690\n频率±1%\t0.1850\t0.1699\n\\(B_m\\)±1%\t0.1837\t0.1687\n\n\
    \n说明模型对小测量误差不敏感，尤其是T2的稳定性较好。\n8. 目前最稳妥的模型选择\n我的建议是：\n如果问题二只要求“构造温度修正SE并和原SE比较”\n\
